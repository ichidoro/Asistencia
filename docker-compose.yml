# Asistencia Aguacol — app + PostgreSQL 16 (BD propia).
#   cp .env.example .env   (completar secretos)   →   docker compose up -d --build
# Actualización desde GitHub: ./deploy.sh  (o el timer de autodeploy, ver docs/DEPLOY_DOCKER_POSTGRES.md)
services:
  db:
    image: postgres:16-alpine
    container_name: asistencia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asistencia_db}
      POSTGRES_USER: ${POSTGRES_USER:-asistencia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      TZ: America/Santiago
    # Ajuste para un servidor de ~30 GB de RAM con disco NVMe y una BD chica (decenas de MB):
    # todo el working set cabe en memoria; pg_stat_statements permite ver qué consultas cuestan.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_connections=50
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=500
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asistencia} -d ${POSTGRES_DB:-asistencia_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sin puerto publicado: solo la app (red interna de compose) habla con la BD.

  app:
    build: .
    container_name: asistencia_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-asistencia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-asistencia_db}
      PORT: "8000"
      TZ: America/Santiago
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
      - ./downloads:/app/downloads
    logging: *logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pgdata:
    name: asistencia_pgdata
