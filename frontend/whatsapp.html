<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vincular WhatsApp</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f6fa;color:#1b2540;margin:0;display:grid;place-items:center;min-height:100vh}
  main{background:#fff;border-radius:14px;padding:28px;width:min(92vw,400px);box-shadow:0 6px 24px #1b254018;text-align:center}
  h1{font-size:1.15rem;margin:0 0 6px} p{margin:6px 0;color:#566;font-size:.92rem}
  img{width:260px;height:260px;margin:12px auto;display:block}
  input,button{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid #c5cbe0}
  button{background:#1f3a93;color:#fff;border:0;cursor:pointer;margin-left:6px} button:disabled{opacity:.5}
  #msg{min-height:1.2em;margin-top:10px;font-size:.9rem}
</style>
</head>
<body><main>
  <h1>WhatsApp de avisos</h1>
  <p id="est">Consultando…</p>
  <img id="qr" alt="Código QR" hidden>
  <p id="ayuda" hidden>En el teléfono: WhatsApp → Dispositivos vinculados → Vincular un dispositivo → escanee este código.</p>
  <div id="prueba" hidden>
    <input id="tel" placeholder="Celular de prueba, ej. 9 1234 5678" inputmode="tel">
    <button id="env">Enviar prueba</button>
  </div>
  <div id="msg"></div>
</main>
<script>
const H = () => ({ Authorization: 'Bearer ' + localStorage.getItem('access_token'), 'Content-Type': 'application/json' });
const $ = id => document.getElementById(id);
const TXT = { conectado: 'Conectado ✔', conectando: 'Conectando…', desconectado: 'Desconectado', sin_puerta: 'La puerta de WhatsApp no responde', apagado: 'Apagado (WHATSAPP_ENABLED=false o sin token)' };
async function refrescar() {
  try {
    const r = await fetch('/api/whatsapp/estado', { headers: H() });
    if (r.status === 401 || r.status === 403) { $('est').textContent = 'Inicie sesión como administrador para ver esto.'; return; }
    const d = await r.json();
    $('est').textContent = TXT[d.estado] || d.estado;
    $('qr').hidden = $('ayuda').hidden = !d.qr; if (d.qr) $('qr').src = d.qr;
    $('prueba').hidden = d.estado !== 'conectado';
  } catch { $('est').textContent = 'Sin conexión con el servidor.'; }
}
$('env').onclick = async () => {
  $('env').disabled = true; $('msg').textContent = 'Enviando…';
  const r = await fetch('/api/whatsapp/prueba', { method: 'POST', headers: H(), body: JSON.stringify({ telefono: $('tel').value }) });
  const d = await r.json().catch(() => ({}));
  $('msg').textContent = r.ok ? 'Enviado ✔' : (d.detail || 'Error al enviar');
  $('env').disabled = false;
};
refrescar(); setInterval(refrescar, 4000);
</script>
</body></html>
