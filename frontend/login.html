<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <meta name="description" content="Portal de Inicio de Sesión - Sistema de Gestión y Control de Asistencia Aguacol.">
    <title>Acceso | Aguacol Asistencia</title>
    <meta name="theme-color" content="#1b2f8f">
    <link rel="icon" href="/static/favicon.ico?v=21">
    <!-- Mismos estilos de la APP principal -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preload" href="/static/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/static/css/all.min.css"></noscript>
    <!-- Auth Service (Sin el Interceptor global para que no intente pedir Token en el login mismo) -->
    <!-- Cargamos Auth, pero evitaremos inicializar el interceptor en esta página o lo ignorará por url -->
    <script src="/static/js/auth.js?v={{ startup_id }}" defer></script>
    <link rel="preload" href="/static/css/fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/css/fonts/barlow-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/css/fuentes.css">
    <link rel="stylesheet" href="/static/css/acceso.css?v={{ startup_id }}">
</head>

<body class="ac">

    <section class="ac-marca" aria-label="Aguacol">
        <i class="ac-ola o1" aria-hidden="true"></i><i class="ac-ola o2" aria-hidden="true"></i><i class="ac-ola o3" aria-hidden="true"></i><i class="ac-ola o4" aria-hidden="true"></i>
        <img class="ac-logo" src="/static/assets/img/logo-aguacol.png" width="300" height="83" alt="Aguacol, calidad y servicio">
        <h2>Control de asistencia</h2>
        <p>Marcaciones, turnos, horas extra, cierres de tramo y portería de Aguacol en un solo lugar.</p>
        <div class="ac-pie">Aguacol<i></i>calidad y servicio</div>
    </section>

    <main class="ac-lado" role="main">
        <form id="loginForm" class="ac-form" novalidate>
            <h1>Iniciar sesión</h1>
            <div class="ac-sub">Ingrese con su usuario de Asistencia.</div>
            <div class="ac-fld">
                <label for="username">Usuario</label>
                <div class="ac-inp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input type="text" id="username" placeholder="Su usuario" required autocomplete="username" autocapitalize="none" spellcheck="false"></div>
            </div>
            <div class="ac-fld">
                <label for="password">Contraseña</label>
                <div class="ac-inp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="password" placeholder="Su contraseña" required autocomplete="current-password">
                    <button type="button" class="ac-ver" id="verClave" aria-label="Mostrar la contraseña" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></button></div>
            </div>
            <button type="submit" class="ac-btn" id="loginBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg><span class="btn-text">Iniciar sesión</span>
                <span class="spinner-border spinner-border-sm loading-spinner" role="status" aria-hidden="true"></span>
            </button>
            <div id="errorMessage" class="ac-error" role="alert" aria-live="polite"></div>
            <div class="ac-legal">&copy; 2026 Aguacol SpA</div>
        </form>
    </main>

    <!-- Script de Login -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Verificar si ya está logueado
            if (AuthService.getToken()) {
                window.location.href = '/';
            }

            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = loginBtn.querySelector('.btn-text');
            const spinner = loginBtn.querySelector('.loading-spinner');
            const errorMessage = document.getElementById('errorMessage');
            const verClave = document.getElementById('verClave');
            const clave = document.getElementById('password');
            verClave.addEventListener('click', () => {
                const ver = clave.type === 'password';
                clave.type = ver ? 'text' : 'password';
                verClave.setAttribute('aria-pressed', String(ver));
                verClave.setAttribute('aria-label', ver ? 'Ocultar la contraseña' : 'Mostrar la contraseña');
                clave.focus();
            });

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                if (!username || !password) {
                    errorMessage.textContent = 'Falta el usuario o la contraseña.';
                    return;
                }

                // Loading state
                loginBtn.disabled = true;
                btnText.textContent = 'Verificando…';
                spinner.style.display = 'inline-block';
                errorMessage.textContent = '';

                try {
                    await AuthService.login(username, password);
                    // Login exitoso, obtener pre-carga de permisos (para UI condicional)
                    try {
                        const permRes = await fetch('/api/auth/permissions/', {
                            headers: { 'Authorization': `Bearer ${AuthService.getToken()}` }
                        });
                        if (permRes.ok) {
                            const pData = await permRes.json();
                            localStorage.setItem('user_permissions', JSON.stringify(pData.permisos));
                        }
                    } catch (e) { console.warn("No se cargaron permisos previos", e); }
                    // 🥚 Easter Egg — Solo para ncarrasco (slideshow)
                    if (username.toLowerCase() === 'ncarrasco') {
                        const totalSlides = 4;
                        let currentSlide = 1;
                        const overlay = document.createElement('div');
                        overlay.id = 'easter-egg-overlay';
                        overlay.innerHTML = `
                            <style>
                                #easter-egg-overlay {
                                    position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.88);
                                    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
                                    animation:eeIn .5s ease-out;cursor:pointer;
                                }
                                @keyframes eeIn{from{opacity:0}to{opacity:1}}
                                @keyframes eeImg{0%{transform:scale(.3) rotate(-10deg);opacity:0}60%{transform:scale(1.03) rotate(1deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
                                @keyframes eeGlow{0%{box-shadow:0 0 20px rgba(255,215,0,.3)}50%{box-shadow:0 0 50px rgba(255,215,0,.6),0 0 80px rgba(255,165,0,.2)}100%{box-shadow:0 0 20px rgba(255,215,0,.3)}}
                                @keyframes eeTxt{from{transform:translateY(15px);opacity:0}to{transform:translateY(0);opacity:1}}
                                #easter-egg-overlay .ee-img{max-width:85vw;max-height:65vh;border-radius:16px;animation:eeImg .7s cubic-bezier(.34,1.56,.64,1),eeGlow 2.5s ease-in-out infinite;transition:opacity .3s}
                                #easter-egg-overlay .ee-n{font-size:1.4rem;font-weight:600;background:linear-gradient(135deg,#FFD700,#FF8C00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:eeTxt .5s ease-out .6s both;opacity:0}
                                #easter-egg-overlay .ee-t{color:#fff;font-size:1rem;font-weight:300;text-align:center;letter-spacing:.5px;animation:eeTxt .5s ease-out .4s both;opacity:0}
                                #easter-egg-overlay .ee-dots{display:flex;gap:8px;animation:eeTxt .4s ease-out 1s both;opacity:0}
                                #easter-egg-overlay .ee-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .3s}
                                #easter-egg-overlay .ee-dot.active{background:#FFD700;transform:scale(1.3)}
                                #easter-egg-overlay .ee-h{font-size: 0.75rem;color:rgba(255,255,255,.35);animation:eeTxt .4s ease-out 1.2s both;opacity:0}
                            </style>
                            <img class="ee-img" src="/huevo_1.jpg" alt="🥚">
                            <div class="ee-n">¡Encontraste el Huevo de Pascua! 🥚✨</div>
                            <div class="ee-t">Un secreto escondido solo para ti</div>
                            <div class="ee-dots">
                                <span class="ee-dot active"></span>
                                <span class="ee-dot"></span>
                                <span class="ee-dot"></span>
                                <span class="ee-dot"></span>
                            </div>
                            <div class="ee-h">Toca para ver la siguiente ▸</div>
                        `;
                        document.body.appendChild(overlay);

                        // 🎵 Música de fondo
                        const audio = new Audio('/cancion.mp3');
                        audio.loop = true;
                        audio.volume = 1.0;
                        audio.play().catch(() => {});

                        const img = overlay.querySelector('.ee-img');
                        const dots = overlay.querySelectorAll('.ee-dot');
                        const hint = overlay.querySelector('.ee-h');
                        overlay.addEventListener('click', () => {
                            if (currentSlide < totalSlides) {
                                currentSlide++;
                                img.style.opacity = '0';
                                img.style.transform = 'scale(0.95)';
                                setTimeout(() => {
                                    img.src = `/huevo_${currentSlide}.jpg`;
                                    img.style.opacity = '1';
                                    img.style.transform = 'scale(1)';
                                }, 300);
                                dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide - 1));
                                if (currentSlide === totalSlides) {
                                    hint.textContent = 'Toca para continuar ✓';
                                }
                            } else {
                                // Fade out audio
                                const fadeAudio = setInterval(() => {
                                    if (audio.volume > 0.05) { audio.volume -= 0.05; }
                                    else { clearInterval(fadeAudio); audio.pause(); }
                                }, 50);
                                overlay.style.transition = 'opacity 0.4s';
                                overlay.style.opacity = '0';
                                setTimeout(() => { overlay.remove(); window.location.href = '/'; }, 400);
                            }
                        });
                    } else {
                        window.location.href = '/';
                    }
                } catch (error) {
                    // Restaurar estado
                    loginBtn.disabled = false;
                    btnText.textContent = 'Iniciar sesión';
                    spinner.style.display = 'none';

                    // Mostrar error
                    errorMessage.textContent = error.message || 'No hay conexión con el servidor. Vuelva a intentarlo.';
                }
            });
        });
    </script>
</body>

</html>
